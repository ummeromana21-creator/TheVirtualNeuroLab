<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivarium · Fly Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234d5a3d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../vendor/fonts/fonts.css?v=1">
<link rel="stylesheet" href="../feather.css?v=2">
<style>
:root{
  --bg:#f6f1e7; --panel:#fbf8f1; --line:#e7e0d1; --ink:#1b1a17; --muted:#6d685d;
  --sage:#4d5a3d; --sage-ink:#ffffff; --sage-tint:#e9ebdc; --chip:#efeadd;
  --shadow:60,48,28; --ease:cubic-bezier(.22,.8,.24,1);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
.hero[data-light="dusk"]{
  --bg:#14170f; --panel:#1b1f15; --line:#2d3324; --ink:#f2ecdf; --muted:#a8a392;
  --sage:#a9b98a; --sage-ink:#14170f; --sage-tint:#283020; --chip:#262b1d;
  --shadow:0,0,0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased; transition:background .6s}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--sage); outline-offset:2px}
.ic{width:20px; height:20px; flex:none}
.hero{position:relative; height:100vh; height:100dvh; overflow:hidden; display:grid;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-columns:minmax(0,1fr) clamp(300px,27vw,356px);
  background:var(--bg); color:var(--ink); transition:background .6s, color .6s}
#navMount{grid-column:1 / -1; position:relative; z-index:20}
#gl{position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; display:block}
/* ---------- sidebar ---------- */
.brand{font-family:var(--serif); font-size:26px; letter-spacing:-.01em; margin:0; font-weight:500}
.brand small{display:block; font-family:var(--sans); font-size:11.5px; color:var(--muted); letter-spacing:.02em; margin-top:2px}
/* ---------- centre ---------- */
.main{display:grid; grid-template-rows:auto minmax(0,1fr); padding:48px 18px 14px 26px; min-width:0; min-height:0}
.tabs{display:flex; gap:10px; margin:0; padding:0; list-style:none}
.tab{width:130px; padding:8px 8px 11px; display:grid; justify-items:center; gap:2px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; cursor:pointer;
  transition:transform .25s var(--ease), background .3s, border-color .3s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--sage-tint); border-color:color-mix(in srgb, var(--sage) 45%, transparent)}
.tab svg{width:58px; height:52px}
.tab .nm{font-family:var(--serif); font-size:15.5px}
.tab .lt{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--muted)}
#stage{position:relative; min-height:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#stage.dragging{cursor:grabbing}
.ground{position:absolute; left:50%; bottom:15%; width:min(92%,720px); height:44px;
  transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(var(--shadow),.22), transparent);
  transition:opacity .3s, transform .3s}
.loader{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted);
  opacity:0; transition:opacity .3s; pointer-events:none}
.loader.show{opacity:1}
.loader .ring{width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--line); border-top-color:var(--sage); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fallback{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  text-align:center; color:var(--muted); font-size:13px; max-width:280px}
.fallback svg{width:120px; height:104px; display:block; margin:0 auto 8px}
.hint{position:absolute; top:6px; right:4px; display:flex; align-items:center; gap:7px;
  font-size:11.5px; color:var(--muted); margin:0; transition:opacity .5s}
.hint.gone{opacity:0}
.hint .ic{width:16px; height:16px}
.rail{position:absolute; left:0; top:50%; transform:translateY(-50%); z-index:6;
  display:grid; gap:9px}
.rail button{width:38px; height:38px; border-radius:50%; background:var(--panel);
  border:1px solid var(--line); cursor:pointer; display:grid; place-items:center;
  transition:border-color .2s, transform .1s, background .3s}
.rail button:hover{border-color:var(--sage)}
.rail button:active{transform:scale(.92)}
.rail button[aria-pressed="true"]{background:var(--sage); color:var(--sage-ink); border-color:var(--sage)}
.rail .ic{width:17px; height:17px}
.parttip{position:absolute; z-index:6; pointer-events:none; font-size:12px; font-weight:700;
  letter-spacing:.01em; background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:4px 12px; white-space:nowrap; transform:translateY(-50%);
  box-shadow:0 2px 10px rgba(var(--shadow),.18)}
.parttip[hidden]{display:none}
.turn{position:absolute; bottom:46px; left:50%; transform:translateX(-50%); z-index:6;
  display:flex; align-items:center; gap:2px; background:var(--panel);
  border:1px solid var(--line); border-radius:999px; padding:3px 6px; font-size:13px}
.turn button{border:0; background:none; cursor:pointer; border-radius:999px;
  min-width:30px; height:26px; display:grid; place-items:center; font-size:13px}
.turn button:hover{background:var(--chip)}
.turn .ic{width:16px; height:16px}
.turn .lbl{padding:0 4px; color:var(--muted)}
.caption{position:absolute; bottom:0; left:0; right:0; text-align:center; margin:0;
  font-family:var(--serif); font-style:italic; font-size:clamp(16px,1.55vw,20px)}
/* ---------- right sheet ---------- */
.info{display:grid; grid-template-rows:auto minmax(0,1fr); gap:16px; padding:13px 26px 14px 0; min-width:0; min-height:0}
.toprow{display:flex; gap:10px; align-items:center}
.search{flex:1; height:32px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px}
.search .ic{width:15px; height:15px; color:var(--muted)}
.search input{flex:1; min-width:0; border:0; background:none; color:inherit; font-size:11.5px; font-family:inherit}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--sage)}
.iconbtn{width:32px; height:32px; border-radius:50%; background:var(--panel);
  border:1px solid var(--line); cursor:pointer; display:grid; place-items:center; flex:none}
.iconbtn:hover{border-color:var(--sage)}
.iconbtn .ic{width:16px; height:16px}
.avatar{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.avatar .ic{width:15px; height:15px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:22px 20px 16px; overflow-y:auto; min-height:0; scrollbar-width:thin}
.card::-webkit-scrollbar{width:6px}
.card::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.card article{display:flex; flex-direction:column; min-height:100%}
.vivrow{display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12.5px}
.vivrow.dim{color:var(--muted); font-size:12px}
.vivrow .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
.vivrow .dot.live{background:var(--sage)}
.seg{display:flex; gap:6px}
.seg button{flex:1; padding:7px 0; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); cursor:pointer; font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--sage-ink)}
p.fine{color:var(--muted); font-size:12px; border-top:1px solid var(--line); margin:10px 0 0; padding-top:8px}
.eyebrow{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0}
h1{font-family:var(--serif); font-weight:500; font-size:clamp(40px,4.2vw,54px);
  line-height:1; letter-spacing:-.025em; margin:8px 0 0}
h1 .sex{font-size:.42em; font-style:italic; color:var(--muted); letter-spacing:0; margin-left:8px}
.tax{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:14px}
.tax div{background:var(--chip); border-radius:8px; padding:6px 8px; min-width:0}
.tax .k{display:block; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
.tax .v{display:block; margin-top:2px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lineage{font-size:11.5px; color:var(--muted); margin:8px 0 0}
.tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.tags span{font-size:11.5px; padding:6px 13px; border-radius:999px; background:var(--chip)}
.desc{font-size:13.5px; line-height:1.55; text-wrap:pretty; margin:14px 0 0}
h2{font-family:var(--serif); font-weight:400; font-size:21px; margin:20px 0 4px;
  border-top:1px solid var(--line); padding-top:14px}
.trait{display:grid; grid-template-columns:22px 92px 1fr; gap:16px; align-items:start;
  font-size:13px; padding:7px 0}
.trait .ic{width:18px; height:18px; color:var(--sage); margin-top:1px}
.trait .k{color:var(--muted)}
.trait .v{min-width:0}
.homerow{display:flex; gap:12px; align-items:flex-start; font-size:13px; padding:7px 0}
.homerow .ic{width:18px; height:18px; color:var(--sage); flex:none; margin-top:1px}
.closeup{margin-top:auto; display:grid; grid-template-columns:76px 1fr 18px; gap:14px; align-items:center;
  padding:10px; border:1px solid var(--line); border-radius:8px; background:none; cursor:pointer;
  text-align:left; width:100%; transition:border-color .2s, background .2s; color:inherit; margin-bottom:0}
.card article > .closeup{margin-top:auto}
.closeup:hover{border-color:var(--sage); background:var(--sage-tint)}
.closeup .lens{display:block; width:76px; height:76px; border-radius:50%; border:1px solid var(--line);
  background-size:520%}
.closeup .ct{display:block; font-family:var(--serif); font-weight:500; font-size:18px}
.closeup p{font-size:11.5px; color:var(--muted); margin:4px 0 0; line-height:1.45}
.closeup .ic{width:18px; height:18px; transition:transform .3s var(--ease)}
.closeup[aria-pressed="true"]{border-color:var(--sage); background:var(--sage-tint)}
.closeup[aria-pressed="true"] .ic{transform:rotate(180deg)}
.swap-out{opacity:0; transform:translateY(-6px); transition:opacity .2s ease-in, transform .2s ease-in}
.swap-in{animation:rise .6s var(--ease) backwards}
@keyframes rise{from{opacity:0; transform:translateY(12px)}}
/* ---------- focus mode ---------- */
.hero.focus #navMount{opacity:0; transform:translateY(-16px); pointer-events:none}
.hero.focus .info{opacity:0; transform:translateX(24px); pointer-events:none}
.hero.focus .tabs{opacity:0; transform:translateY(-16px); pointer-events:none}
#navMount,.info,.tabs{transition:opacity .5s var(--ease), transform .5s var(--ease)}
/* ---------- phone top bar ---------- */
.phonetop{display:none}
/* ---------- tablet ---------- */
@media (max-width:1100px){
  .hero{grid-template-columns:minmax(0,1fr) clamp(280px,36vw,340px)}
  .main{padding-left:20px}
}
/* ---------- phone ---------- */
@media (max-width:760px){
  .hero{display:flex; flex-direction:column; height:100dvh}
  .phonetop{display:flex; align-items:center; gap:10px; padding:10px 14px 0}
  .phonetop .brand{display:none}
  .phonetop .iconbtn{border-radius:50%}
  .psearch{position:absolute; top:52px; left:14px; right:14px; z-index:8; display:none;
    background:var(--panel); border:1px solid var(--sage); border-radius:8px; padding:0 10px; height:36px}
  .psearch.show{display:flex; align-items:center; gap:8px}
  .psearch input{flex:1; border:0; background:none; color:inherit; font-size:13px; font-family:inherit}
  .psearch input:focus{outline:none}
  .main{flex:1; min-height:0; padding:10px 14px 6px; grid-template-rows:auto minmax(0,1fr)}
  .tabs{gap:8px}
  .tab{flex:1; width:auto; grid-template-columns:44px 1fr; grid-template-rows:auto auto;
    justify-items:start; align-items:center; padding:6px 10px; column-gap:10px}
  .tab svg{width:44px; height:40px; grid-row:1/3}
  .tab .nm{font-size:15px}
  .tab .lt{font-size:12px}
  .hint{display:none}
  .ground{bottom:17%; height:30px}
  .rail button{width:34px; height:34px}
  .rail{gap:7px}
  .turn{bottom:30px}
  .caption{font-size:15px}
  .info{padding:0; display:block; position:relative; z-index:7}
  .info .toprow{display:none}
  .card{max-height:40dvh; border-radius:16px 16px 0 0; border-left:0; border-right:0; border-bottom:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  h1{font-size:34px}
  h2{font-size:19px}
  .tax{grid-template-columns:repeat(2,1fr)}
  .hero.focus .info{transform:translateY(100%); opacity:1}
  .hero.focus .phonetop{opacity:0; pointer-events:none}
  .phonetop{transition:opacity .5s var(--ease)}
}
/* ---------- short viewports ---------- */
@media (max-height:620px) and (min-width:761px){
  .main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>

<div class="hero" id="hero" data-light="day">
  <canvas id="gl"></canvas>

  <header id="navMount"></header>

  <div class="phonetop">
    <p class="brand">Fly Guide</p>
    <button id="phoneSearchBtn" class="iconbtn" aria-label="Search flies"><svg class="ic"><use href="#i-search"/></svg></button>
    <button class="iconbtn" aria-label="Notifications"><svg class="ic"><use href="#i-bell"/></svg></button>
    <button class="iconbtn avatar" aria-label="Account"><svg class="ic"><use href="#i-user"/></svg></button>
    <div class="psearch" id="phoneSearchWrap">
      <svg class="ic" style="width:15px;height:15px;color:var(--muted)"><use href="#i-search"/></svg>
      <input id="phoneSearchInput" type="text" placeholder="Try “maxime” or “hagrid”…" aria-label="Search flies">
    </div>

      if (m.userData.orig === undefined) {
        m.userData.orig = { transparent: m.transparent, opacity: m.opacity, depthWrite: m.depthWrite };
      }
      if (mode === 0) { Object.assign(m, m.userData.orig); o.visible = true; }
      else if (mode === 1) {
        m.transparent = true; m.opacity = Math.min(m.userData.orig.opacity, 0.22);
        m.depthWrite = false; o.visible = true;
      } else { o.visible = false; }
      m.needsUpdate = true;
    });
    for (const p of rig.proxies) p.visible = mode !== 2;
  }
  document.querySelectorAll('[data-cut]').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.cut === mode)));
  interact();
}

// ---- state ----
let active = 1;  // Hagrid by default (mirrors the reference: second tab)
let zoom = 1, zoomTarget = 1;
let velX = 0, velY = 0;          // inertia (rad/s about world Y / X)
let turnQueue = 0;               // queued yaw from the turn pill
let resetting = false;
let lastInteract = -10, idleW = 0;
let closeupBtn = null;

// ---- framing: origin renders at the stage centre via setViewOffset ----
let heroW = 1, heroH = 1, stageL = 0, stageT = 0, stageW = 1, stageH = 1;
let tCx = 0, tCy = 0, tPx = 100, cx = 0, cy = 0, px = 100;
function measure() {
  const hb = hero.getBoundingClientRect(), sb = stage.getBoundingClientRect();
  heroW = hb.width; heroH = hb.height;
  stageL = sb.left - hb.left; stageT = sb.top - hb.top;
  stageW = sb.width; stageH = sb.height;
  // Two specimens share the width: fit ~2.3 units of fly per half-stage.
  const focus = hero.classList.contains('focus');
  tPx = focus
    ? Math.min(heroW * 0.30, heroH * 0.62) * 1.16
    : Math.min(stageW * 0.24, stageH * 0.62) * 1.16;
  retarget();
  renderer.setSize(heroW, heroH, false);
  camera.aspect = heroW / heroH;
  camera.updateProjectionMatrix();
}
// Framing target, re-evaluated every frame: centred on the table, drifting
// toward the selected fly when zoomed to close-up.
function retarget() {
  const focus = hero.classList.contains('focus');
  const w = focus ? heroW : stageW;
  tCx = (focus ? heroW / 2 : stageL + stageW / 2) +
    (zoomTarget > 1.8 ? (active ? 1 : -1) * w * 0.20 : 0);
  tCy = focus ? heroH * 0.5 : stageT + stageH * 0.44;
}
new ResizeObserver(measure).observe(hero);
new ResizeObserver(measure).observe(stage);

const zinBtn = $('zin'), zoutBtn = $('zout');
const HOME_T = new THREE.Quaternion();  // table rest pose (both flies face out)
function applyYaw(a) {
  table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(YAXIS, a));
}

// Alternating-tripod walk in place: legs swing fore-aft, knees lift on the
// swing half; the body bobs at twice the stride rate. Stride rate follows
// the sim's leg-motor firing when live, else a resting amble.
function stepGait(rig, t, dt, i, s) {
  const legs = rig.model.userData.rig && rig.model.userData.rig.legs;
  if (!legs) return;
  let freq = 7;
  if (s && Array.isArray(s.legs) && s.legs.length) {
    const m = s.legs.reduce((a, v) => a + (+v || 0), 0) / s.legs.length;
    const b = Viv.base[i];
    b.walk = b.walk > 0 ? b.walk + 0.003 * (m - b.walk) : m;
    freq = 7 * clamp(m / Math.max(b.walk, 1e-6), 0.4, 2.2);
  }
  rig.stride += dt * freq;
  const wt = rig.stride + rig.gait;
  for (const leg of legs) {
    const sw = Math.sin(wt + leg.phase);
    leg.hip.rotation.x = 0.30 * sw;
    leg.hip.rotation.z = 0.05 * sw;
    leg.knee.rotation.x = 0.28 * Math.sin(wt + leg.phase + 0.7);
    leg.ankle.rotation.x = -0.32 * Math.sin(wt + leg.phase + 0.7);
  }
  rig.pivot.position.y = Math.sin(t * 1.3 + rig.gait) * 0.028 + Math.sin(2 * wt) * 0.016;
  rig.pivot.rotation.x = Math.sin(2 * wt) * 0.018;
}

// Brain glow: sim firing rate against a slow baseline when live, else a
// resting pulse. The photoreceptor overlay flashes with the light stimulus.
function stepGlow(rig, t, dt, i, s) {
  const b = rig.brain;
  if (!b) return;
  let g = 1 + 0.15 * Math.sin(t * 0.8 + rig.gait);
  if (s && s.rates && isFinite(+s.rates.all)) {
    const r = +s.rates.all, base = Viv.base[i];
    base.glow = base.glow > 0 ? base.glow + 0.003 * (r - base.glow) : r;
    g = clamp(r / Math.max(base.glow, 1e-6), 0.35, 2.4);
  }
  b.soma.material.opacity = clamp(0.45 + 0.22 * g, 0, 1);
  b.soma.material.size = 0.006 + 0.0022 * g;
  const pm = b.photo && b.photo.material;
  if (pm) pm.opacity += ((s ? 0.9 * Math.min(Viv.light[i], 1) : 0) - pm.opacity) * damp(8, dt);
}

function shortAngle(from, to) {
  return Math.atan2(Math.sin(to - from), Math.cos(to - from));
}

// ---------- vivarium live link: each fly trails its own box slot ----------
const Viv = {
  ws: null, live: false, lastMsg: 0, step: 0,
  slots: [null, null], light: [0, 0], drugs: [[], []],
  base: [{ glow: 0, walk: 0 }, { glow: 0, walk: 0 }],  // slow adaptive baselines
};
function vivConnect() {
  let ws;
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') +
      '://' + (location.hostname || 'localhost') + ':8765');
  } catch { setTimeout(vivConnect, 5000); return; }
  Viv.ws = ws;
  ws.onmessage = ev => { try { vivState(JSON.parse(ev.data)); } catch {} };
  ws.onclose = () => { Viv.ws = null; Viv.live = false; paintVivarium(); setTimeout(vivConnect, 5000); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
function vivState(m) {
  if (!m || m.type !== 'state' || !m.flies) return;
  Viv.live = true;
  Viv.lastMsg = performance.now();
  Viv.step = m.t || 0;
  for (let i = 0; i < 2; i++) {
    const s = m.flies[SLOTS[i]];
    if (!s) continue;
    Viv.slots[i] = s;
    Viv.drugs[i] = Object.entries(s.drugs || {}).filter(([, v]) => +v > 0)
      .map(([k, v]) => `${k} ${(+v).toFixed(2)}`);
    const li = (s.stimuli && s.stimuli.light) || [0, 0];
    Viv.light[i] = Math.max(+li[0] || 0, +li[1] || 0);
    if (s.banana && bananas[i]) {
      bananas[i].position.x = (+s.banana.x || 0) * ARENA_K;  // stage-local
      bananas[i].position.z = (+s.banana.y || 0) * ARENA_K;
    }
  }
  paintVivarium();
}
function paintVivarium() {
  const dot = $('vivDot'), status = $('vivStatus'), boxes = $('vivBoxes');
  if (!dot || !status || !boxes) return;  // sheet mid-swap
  dot.classList.toggle('live', Viv.live);
  status.textContent = Viv.live ? `Live from the sim · step ${Viv.step}.` : 'Illustrated rest — lab offline.';
  const side = i => `${FLIES[i].name} · ${i ? 'treatment' : 'control'} box` +
    (Viv.slots[i] && isFinite(+Viv.slots[i].dist) ? ` · banana ${(+Viv.slots[i].dist).toFixed(1)}` : '') +
    (Viv.drugs[i].length ? ` · ${Viv.drugs[i].join(', ')}` : '');
  boxes.textContent = `${side(0)} — ${side(1)}`;
}

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Eased framing + zoom.
  retarget();
  const k7 = damp(7, dt);
  cx += (tCx - cx) * k7; cy += (tCy - cy) * k7; px += (tPx - px) * k7;
  zoom += (zoomTarget - zoom) * damp(6, dt);
  const fovR = THREE.MathUtils.degToRad(camera.fov);
  camera.position.z = heroH / (2 * Math.tan(fovR / 2) * px * zoom);
  camera.setViewOffset(heroW, heroH, heroW / 2 - cx, heroH / 2 - cy, heroW, heroH);
  camera.updateProjectionMatrix();  // offsets apply only here — without this the eased pan never lands

  // Dusk easing.
  duskW += (duskTarget - duskW) * damp(4, dt);
  hemi.intensity = DAY.hemi + (DUSK.hemi - DAY.hemi) * duskW;
  key.intensity = DAY.key + (DUSK.key - DAY.key) * duskW;
  key.color.copy(DAY.keyC).lerp(DUSK.keyC, duskW);
  rim.intensity = DAY.rim + (DUSK.rim - DAY.rim) * duskW;
  renderer.toneMappingExposure = DAY.exp + (DUSK.exp - DAY.exp) * duskW;
  scene.fog.color.copy(DAY.fog).lerp(DUSK.fog, duskW);
  const bSide = duskW > 0.5;
  if (bSide !== brainSide) { brainSide = bSide; for (const r of rigs) if (r) paintBrain(r); }

  // Inertia + turn queue + reset-to-home: the whole table turns.
  if (velX !== 0 || velY !== 0) {
    table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(YAXIS, velX * dt));
    table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(XAXIS, velY * dt));
    const d = Math.exp(-dt * 4.5);
    velX *= d; velY *= d;
    if (Math.abs(velX) < 1e-4) velX = 0;
    if (Math.abs(velY) < 1e-4) velY = 0;
  }
  if (turnQueue !== 0) {
    const step = turnQueue * damp(4.2, dt);
    applyYaw(step);
    turnQueue -= step;
    if (Math.abs(turnQueue) < 1e-4) turnQueue = 0;
  }
  if (resetting) {
    table.quaternion.slerp(HOME_T, damp(6, dt));
    if (table.quaternion.angleTo(HOME_T) < 0.002 && Math.abs(zoomTarget - 1) < 1e-6) {
      table.quaternion.copy(HOME_T);
      resetting = false;
    }
  }
  // Life per specimen: true sim spots when live, illustrated anchors when not.
  // Everything eases, so lab connects/disconnects never jump the table.
  if (!REDUCED) {
    const target = (t - lastInteract > 1.8) ? 1 : 0;
    idleW += (target - idleW) * damp(2, dt);
    const live = Viv.live && (performance.now() - Viv.lastMsg < 6000);
    for (let i = 0; i < 2; i++) {
      const rig = rigs[i];
      if (!rig) continue;
      const s = live ? Viv.slots[i] : null;
      const k = damp(s ? 3.5 : 2, dt);
      const tx = s && s.fly ? HALF_X[i] + s.fly.x * ARENA_K : (i === 0 ? -SPREAD : SPREAD);
      const tz = s && s.fly ? s.fly.y * ARENA_K : 0;
      rig.pivot.position.x += (tx - rig.pivot.position.x) * k;
      rig.pivot.position.z += (tz - rig.pivot.position.z) * k;
      const wantY = s && s.fly && isFinite(+s.fly.angle) ? Math.PI / 2 - s.fly.angle
        : Math.sin(t * 0.55 + rig.gait) * 0.16 * idleW + Math.sin(t * 0.23 + rig.gait * 2.1) * 0.10;
      rig.pivot.rotation.y += shortAngle(rig.pivot.rotation.y, wantY) * k;
      rig.zoomK += ((s ? LIVE_SCALE : 1) - rig.zoomK) * damp(2, dt);
      if (normScale) {
        rig.holder.scale.setScalar(normScale * rig.zoomK);
        stages[i].position.y = FOOT_Y * normScale * rig.zoomK;  // floors ride the feet
      }
      sprigs[i].rotation.z = Math.sin(t * 0.9 + i * 2.4) * 0.03;
      stepGait(rig, t, dt, i, s);
      stepGlow(rig, t, dt, i, s);
    }
  }

  zinBtn.setAttribute('aria-pressed', String(zoom >= 1));
  zoutBtn.setAttribute('aria-pressed', String(zoom < 1));
  if (closeupBtn) closeupBtn.setAttribute('aria-pressed', String(zoom > 2.2));

  renderer.render(scene, camera);
  if (!booted) {
    booted = true;
    loader.classList.remove('show');
  }
}

// =====================================================================
// 6. INPUT + CONTROLS
// =====================================================================
function interact() {
  lastInteract = clock.elapsedTime;
  hint.classList.add('gone');
  resetting = false;
  hideTip();
}
function resetView() {
  zoomTarget = 1; turnQueue = 0; velX = 0; velY = 0;
  resetting = true;
  interact();
}

// ---- free rotation with inertia + two-finger pinch ----
const pointers = new Map();
let pinchD = 0, lastPX = 0, lastPY = 0, lastPT = 0;
let tapX = 0, tapY = 0, tapT = 0;
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) { interact(); return; }  // let rail/pill clicks through
  tapX = e.clientX; tapY = e.clientY; tapT = performance.now();
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) {
    lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now();
    velX = 0; velY = 0;
    stage.classList.add('dragging');
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchD = Math.hypot(a[0] - b[0], a[1] - b[1]);
  }
  interact();
});
stage.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinchD > 0) zoomTarget = clamp(zoomTarget * d / pinchD, ZMIN, ZMAX);
    pinchD = d;
    interact();
    return;
  }
  if (!stage.classList.contains('dragging')) return;
  const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  const now = performance.now(), dts = Math.max((now - lastPT) / 1000, 1e-3);
  lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
  const k = Math.PI / Math.max(260, px * 1.6);
  table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(YAXIS, dx * k));
  table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(XAXIS, dy * k));
  velX = 0.75 * velX + 0.25 * (dx * k / dts);
  velY = 0.75 * velY + 0.25 * (dy * k / dts);
  interact();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchD = 0;
  if (pointers.size === 0) stage.classList.remove('dragging');
  // Tap (no hover on touch): name the part briefly + select that fly's sheet.
  if (e.type === 'pointerup' && e.clientX !== undefined && !e.target.closest('button') &&
      Math.hypot(e.clientX - tapX, e.clientY - tapY) < 8 &&
      performance.now() - tapT < 350) {
    const hit = partAt(e.clientX, e.clientY);
    if (hit) {
      moveTip(e.clientX, e.clientY, hit.part);
      clearTimeout(tipTimer);
      tipTimer = setTimeout(hideTip, 1600);
      selectTab(hit.fly);
    }
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

// ---- wheel zoom ----
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomTarget = clamp(zoomTarget * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), ZMIN, ZMAX);
  interact();
}, { passive: false });

// ---- double-click / keyboard ----
stage.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) resetView(); });
stage.addEventListener('keydown', (e) => {
  const step = 0.18;
  if (e.key === 'ArrowLeft') { applyYaw(-step); interact(); }
  else if (e.key === 'ArrowRight') { applyYaw(step); interact(); }
  else if (e.key === 'ArrowUp') {
    table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(XAXIS, -step)); interact();
  } else if (e.key === 'ArrowDown') {
    table.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(XAXIS, step)); interact();
  } else if (e.key === '+' || e.key === '=') { zoomTarget = clamp(zoomTarget * 1.2, ZMIN, ZMAX); interact(); }
  else if (e.key === '-' || e.key === '_') { zoomTarget = clamp(zoomTarget / 1.2, ZMIN, ZMAX); interact(); }
  else if (e.key === '0') resetView();
  else return;
  e.preventDefault();
});

// ---- hover hotspots: raycast the invisible proxies, name the part ----
const partTip = $('partTip'), labelBtn = $('labelBtn');
let labelsOn = true, tipTimer = 0;
const raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
function partAt(clientX, clientY) {
  if (!labelsOn || !rigs[0] || !rigs[1]) return null;
  const hb = hero.getBoundingClientRect();  // canvas covers the whole hero
  _ndc.set(((clientX - hb.left) / hb.width) * 2 - 1, -((clientY - hb.top) / hb.height) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObjects([rigs[0].proxies, rigs[1].proxies].flat(), false)
    .filter(h => h.object.visible);  // raycast ignores visibility; hidden cuticle hides its tips
  if (!hits.length) return null;
  const u = hits[0].object.userData;
  return { part: u.part, fly: u.fly };
}
function moveTip(clientX, clientY, text) {
  const sb = stage.getBoundingClientRect();
  partTip.textContent = text;
  partTip.hidden = false;
  partTip.style.left = '0px';
  partTip.style.top = `${clientY - sb.top}px`;
  const w = partTip.offsetWidth;
  let x = clientX - sb.left + 14;
  if (x + w > sb.width - 6) x = clientX - sb.left - 14 - w;
  partTip.style.left = `${x}px`;
}
function hideTip() { partTip.hidden = true; }
stage.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  if (stage.classList.contains('dragging')) { hideTip(); return; }
  const hit = partAt(e.clientX, e.clientY);
  if (hit) moveTip(e.clientX, e.clientY, hit.part);
  else hideTip();
});
stage.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') hideTip(); });

// ---- rail buttons ----
zinBtn.addEventListener('click', () => { zoomTarget = clamp(zoomTarget * 1.35, ZMIN, ZMAX); interact(); });
zoutBtn.addEventListener('click', () => { zoomTarget = clamp(zoomTarget / 1.35, ZMIN, ZMAX); interact(); });
$('expand').addEventListener('click', () => {
  const on = hero.classList.toggle('focus');
  $('expand').setAttribute('aria-pressed', String(on));
  measure();  // hero size unchanged: retarget framing manually
  interact();
});
labelBtn.addEventListener('click', () => {

});
$('lightBtn').addEventListener('click', () => {
  const dusk = hero.dataset.light !== 'dusk';

  document.body.style.background = dusk ? '#14170f' : '';

addEventListener('keydown', (e) => {

// ---- turn pill ----
$('ccw').addEventListener('click', () => { turnQueue -= Math.PI / 2; interact(); });
$('cw').addEventListener('click', () => { turnQueue += Math.PI / 2; interact(); });

// ---- search: Enter jumps to the matching fly ----
function searchTo(q) {

tabs.forEach((tab, i) => tab.addEventListener('click', () => selectTab(i)));
tablist.addEventListener('keydown', (e) => {

function renderInfo(i) {
  detail.innerHTML = infoHTML(i);
  closeupBtn = $('closeup');
  const lens = closeupBtn.querySelector('.lens');
  lens.style.backgroundImage = FACET;
  lens.style.backgroundPosition = FLIES[i].lensPos;
  closeupBtn.setAttribute('aria-pressed', String(zoom > 2.2));
  closeupBtn.addEventListener('click', () => {
    zoomTarget = zoomTarget > 1.8 ? 1 : CLOSEUP_Z;
    interact();
  });
  detail.querySelectorAll('[data-cut]').forEach(b =>
    b.addEventListener('click', () => setCuticle(+b.dataset.cut)));
  paintVivarium();
}

function swapInfo(to) {
  [...detail.children].forEach((el) => el.classList.add('swap-out'));
  setTimeout(() => {
    renderInfo(to);
    caption.textContent = FLIES[to].caption;
    [...detail.children].forEach((el, idx) => {
      el.style.animationDelay = `${idx * 45}ms`;
      el.classList.add('swap-in');
    });
  }, REDUCED ? 0 : 200);
}

// =====================================================================
// 8. BOOT
// =====================================================================
function boot() {
  measure();
  cx = tCx; cy = tCy; px = tPx;  // settled framing on first frame
  renderInfo(active);
  caption.textContent = FLIES[active].caption;
  loader.classList.add('show');
  try {
    buildRig(0);
    buildRig(1);
  } catch (err) {
    showFallback('This specimen could not be prepared: ' + (err && err.message ? err.message : err));
    return;
  }
  vivConnect();
  tick();
}
boot();
</script>
